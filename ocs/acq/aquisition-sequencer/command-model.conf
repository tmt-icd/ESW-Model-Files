subsystem = ESW
component = AcquisitionSequencer
description = "Acquisition Sequencer commands."

receive = [
  {
    name = slewTelescope
    description = """
            Slew telescope to the specified position (TBD).
            """
    requiredArgs = [target]
    completionType = longRunning
    parameters = [
      {
        name = target
        description = """
                    Target Position (TBD).
                    """
        type = eqCoord
      }
    ]
  }
  {
    name = offsetTelescope
    description = """
            Apply an offset to the current telescope position. (TBD)
            """
    requiredArgs = [offsetX, offsetY, coordSys]
    completionType = longRunning
    parameters = [
      {
        name = offsetX
        description = """
                    Amount to offset in X in coordinate system.
                """
        type = double
      }
      {
        name = offsetY
        description = """
                      Amount to offset in Y in coordinate system.
                  """
        type = double
      }
      {
        name = coordSys
        description = """
                    Coordinate system used for chosen offset
                    """
        enum = [RADECOFF, AZELOFF, FOCALOFF, INSTOFF]
      }
    ]
  }
  {
    name = takeScienceExposure
    description = """
              Take a science exposure with the specified instrument.
              Instrument configuration parameters are TBD.
            """
    completionType = longRunning
    requiredArgs = [instrument]
    parameters = [
      {
        name = instrument
        description = """
            Name of instrument to take the exposure
          """
        enum = [IRIS_IMAGER, IRIS_IFS, MODHIS, WFOS]
      }
      {
        name = instrumentConfiguration
        description = """
            Configuration of instrument.  This is a placeholder for a TBD format.  May be multiple parameters.
          """
        type = string
      }
    ]
  }
]

