subsystem = ESW
component = AcquisitionSequencer
modelVersion = "4.0"

wbsId = tmt.deops.esw.ocs

title = "ESW Sequencer for Acquisition"
componentType = Sequencer

description = """
The ESW Acquisition Sequencer is the an ESW sequencer that can be used during acquistion.  This
sequencer is primarily used by other subystems when they need the telescope moved or an
exposure taken by a science instrument.  This is used primarily during calibrations.  During observations,
the TLS will coordinate the activities of the telescope and instruments.

This Sequencer was created from the Preliminary Design work of the AO Sequencer.
Currently, there is no send command model for this Sequencer -- this Sequencer will send
commands to TCS/MCS and science instruments, but details have not been worked out.
Much of this API should be considered placeholders until ESW ACQ design matures.

Note that APS has its own ESW acqusition sequencer, which might eventually be merged with this one.
"""